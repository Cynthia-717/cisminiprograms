<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>微學程課程查詢系統</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">微學程查詢系統</p>
          <h1>快速查詢課程、確認學年度與學期，並整理領域統計</h1>
          <p class="hero-copy">
            支援單一課程搜尋、批次比對多門課程、四大領域分類，以及依年度彙整同領域微學程內容。
          </p>
        </div>
        <div class="hero-badge">可直接開啟使用</div>
      </header>

      <main class="grid-layout">
        <section class="panel">
          <h2>1. 單一課程查詢</h2>
          <div class="control-row">
            <input id="courseInput" type="text" placeholder="例如：Python程式設計" />
            <button id="searchBtn">搜尋</button>
          </div>
          <div id="singleResult" class="result-card"></div>
        </section>

        <section class="panel">
          <h2>2. 批次確認多門課程</h2>
          <p class="hint">可輸入多門課程，請以逗號、空白或換行分隔。</p>
          <textarea id="batchInput" rows="8" placeholder="Python程式設計&#10;機器學習&#10;資料探勘"></textarea>
          <button id="batchBtn">批次比對</button>
          <div id="batchResult" class="result-card"></div>
        </section>

        <section class="panel full-span">
          <h2>3. 領域與年度統計</h2>
          <p class="hint">此區塊已移至獨立頁面，內容較長時可單獨檢視，方便你逐筆整理與調整資料。</p>
          <a class="page-link" href="statistics.html">前往領域與年度統計頁</a>
        </section>

        <section class="panel full-span">
          <h2>4. 完整清單與同領域年度匯整</h2>
          <p class="hint">請先選擇領域，再依年度展開查看各規劃書與其內含課程。</p>
          <div class="filter-row">
            <label>
              選擇領域
              <select id="aggregateDomain"></select>
            </label>
          </div>
          <div id="aggregateResult" class="result-card"></div>
        </section>
      </main>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
